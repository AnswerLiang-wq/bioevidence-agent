name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install exact CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check src apps tests scripts
      - name: Check browser JavaScript syntax when Node.js is available
        run: |
          if command -v node >/dev/null 2>&1; then
            node --check apps/product_demo/static/app.js
          else
            echo "Node.js unavailable; skipping JavaScript syntax check"
          fi
      - name: Test
        run: python -m pytest -q
      - name: Verify v0.5.0 release hashes and public boundary
        run: python scripts/verify_release.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Fresh out-of-tree release-wheel smoke
        run: |
          SMOKE_ENV="${RUNNER_TEMP}/bioevidence-smoke"
          SMOKE_JSON="${RUNNER_TEMP}/bioevidence-demo.json"
          python -m venv "${SMOKE_ENV}"
          "${SMOKE_ENV}/bin/python" -m pip install \
            "${GITHUB_WORKSPACE}"/artifacts/bioevidence_agent-0.5.0-py3-none-any.whl
          "${SMOKE_ENV}/bin/python" -c \
            'import bioevidence; assert bioevidence.__version__ == "0.5.0"'
          "${SMOKE_ENV}/bin/bioevidence" demo \
            --question "Do mitochondria participate in programmed cell death?" \
            > "${SMOKE_JSON}"
          SMOKE_JSON="${SMOKE_JSON}" "${SMOKE_ENV}/bin/python" -c \
            'import json, os; d=json.load(open(os.environ["SMOKE_JSON"])); assert d["retrieved"]["pmid"] == "1001"'
