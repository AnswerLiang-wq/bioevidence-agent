name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.lock
      - name: Install exact CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/ci.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Verify release allowlist and hashes
        run: python scripts/verify_release.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Fresh out-of-tree wheel smoke
        run: |
          python -m venv --system-site-packages /tmp/bioevidence-smoke
          /tmp/bioevidence-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/bioevidence-smoke/bin/bioevidence demo \
            --question "Do mitochondria participate in programmed cell death?" \
            > /tmp/bioevidence-demo.json
          /tmp/bioevidence-smoke/bin/python -c \
            'import json; d=json.load(open("/tmp/bioevidence-demo.json")); assert d["retrieved"]["pmid"] == "1001"'
